<title>吉吉团队协同 v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：预览控制条 + 一扇桌面窗口（标题栏 / 72px 图标导航 / 内容区）；会议时整窗切到深色舞台。
   色彩取自 native-client/theme.json，与 v1 设计稿同源：暖白画布、炭黑文字、品牌金。 */
:root{
  --page:#ECE9E3;
  --bg:#FAF9F6; --panel:#F4F2ED; --raised:#FFFFFF;
  --fg:#161513; --muted-fg:#64615C; --faint-fg:#8F8A82;
  --border:#E3E0DA; --input:#D9D5CD; --hover:rgba(22,21,19,.05); --press:rgba(22,21,19,.09);
  --gold:#F5C542; --gold-fg:#161513; --gold-soft:#FBEBB8; --gold-tint:#FCF3D9; --gold-ink:#7A5A00; --ring:#A47700;
  --ok:#2F9E5B; --warn:#A86A12; --warn-soft:#FBF0DC; --danger:#D64A3F; --danger-soft:#FBE6E3; --danger-fg:#FFFFFF;
  --stage:#161513; --stage-2:#211F1C; --stage-3:#2C2A26; --stage-fg:#FAF9F6; --stage-muted:#B8B2A8; --stage-border:#3B3832;
  --av-s:52%; --av-l:91%; --av-fl:33%;
  --shadow:0 1px 2px rgba(22,21,19,.06),0 12px 40px rgba(22,21,19,.12);
  --shadow-pop:0 4px 12px rgba(22,21,19,.10),0 18px 48px rgba(22,21,19,.16);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0A09;
  --bg:#161513; --panel:#1B1917; --raised:#23211E;
  --fg:#FAF9F6; --muted-fg:#B8B2A8; --faint-fg:#8A847A;
  --border:#34312C; --input:#514C43; --hover:rgba(250,249,246,.06); --press:rgba(250,249,246,.10);
  --gold-soft:#45391D; --gold-tint:#2E2717; --gold-ink:#F5C542; --ring:#F5C542;
  --warn:#E7B04F; --warn-soft:#352A16; --danger-soft:#3A1F1C;
  --stage:#0E0D0C; --stage-2:#1A1917; --stage-3:#262420;
  --av-s:24%; --av-l:24%; --av-fl:80%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45);
  --shadow-pop:0 4px 12px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0B0A09;
  --bg:#161513; --panel:#1B1917; --raised:#23211E;
  --fg:#FAF9F6; --muted-fg:#B8B2A8; --faint-fg:#8A847A;
  --border:#34312C; --input:#514C43; --hover:rgba(250,249,246,.06); --press:rgba(250,249,246,.10);
  --gold-soft:#45391D; --gold-tint:#2E2717; --gold-ink:#F5C542; --ring:#F5C542;
  --warn:#E7B04F; --warn-soft:#352A16; --danger-soft:#3A1F1C;
  --stage:#0E0D0C; --stage-2:#1A1917; --stage-3:#262420;
  --av-s:24%; --av-l:24%; --av-fl:80%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.45);
  --shadow-pop:0 4px 12px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 外层：预览控制条 + 窗口 ---------- */
.shell{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 16px;gap:10px}
.proto{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none;min-width:0}
.proto::-webkit-scrollbar{display:none}
.proto .lbl{font-size:12px;color:var(--faint-fg);letter-spacing:.04em;white-space:nowrap;margin-right:2px}
.proto .sep{width:1px;height:18px;background:var(--input);margin:0 6px;flex:none}
.pchip{white-space:nowrap;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--input);color:var(--muted-fg);background:transparent}
.pchip:hover{color:var(--fg);border-color:var(--faint-fg)}
.pchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.window{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;position:relative;border:1px solid var(--border);max-width:1480px;width:100%;margin:0 auto}

/* 标题栏 */
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--border);background:var(--panel);user-select:none}
.lights{display:flex;gap:8px;margin-right:6px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.tb-title{font-size:13px;font-weight:600;white-space:nowrap}
.tb-ws{font-size:12.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.netpill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.netpill.reconnecting{color:var(--warn);background:var(--warn-soft)}
.netpill.offline{color:var(--danger);background:var(--danger-soft)}
.privacy{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:var(--danger);color:var(--danger-fg);white-space:nowrap}
.privacy .pulse{width:7px;height:7px;border-radius:50%;background:#fff}
.kbd{font:11px var(--mono);border:1px solid var(--input);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted-fg)}
.tb-search{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 8px 0 10px;border-radius:7px;background:var(--hover);color:var(--muted-fg);font-size:12.5px;min-width:200px}
.tb-search:hover{background:var(--press)}
.window.in-call .titlebar{background:var(--stage);border-color:var(--stage-border);color:var(--stage-fg)}
.window.in-call .tb-ws,.window.in-call .tb-search{color:var(--stage-muted)}
.window.in-call .tb-search{background:rgba(255,255,255,.06)}

.body{flex:1;min-height:0;display:flex}

/* 图标导航 */
.rail{width:72px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.ws-btn{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;position:relative;margin-bottom:8px}
.ws-btn svg{width:40px;height:40px;border-radius:10px}
.ws-btn:hover{background:var(--hover)}
.navbtn{width:52px;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted-fg);position:relative;font-size:11px}
.navbtn svg.i{width:21px;height:21px}
.navbtn:hover{background:var(--hover);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--gold-soft);color:var(--fg)}
.navbtn .badge{position:absolute;top:4px;right:6px}
.navbtn .live{position:absolute;top:7px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--panel)}
.rail .grow{flex:1}
.me-btn{position:relative;margin-top:4px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--gold-fg);font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;line-height:1}
.badge.muted{background:var(--input);color:var(--fg)}

/* 头像 */
.av{--h:40;width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:600;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 45% var(--av-fl));position:relative}
.av.sq{border-radius:10px}
.av.sm{width:28px;height:28px;font-size:12px}
.av.xs{width:22px;height:22px;font-size:10.5px}
.av.lg{width:64px;height:64px;font-size:24px}
.av.xl{width:84px;height:84px;font-size:32px}
.st{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--faint-fg)}
.st.online{background:var(--ok)}.st.away{background:var(--warn)}.st.meeting{background:var(--danger)}.st.offline{background:var(--input)}
.stack{display:flex}
.stack .av{box-shadow:0 0 0 2px var(--bg);margin-left:-6px}
.stack .av:first-child{margin-left:0}
.stack .more{width:28px;height:28px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-size:11px;color:var(--muted-fg);margin-left:-6px;box-shadow:0 0 0 2px var(--bg)}

/* 通用控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r);font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid var(--input);background:var(--raised)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-fg);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.primary:disabled{background:var(--hover);border-color:var(--border);color:var(--faint-fg);filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-fg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:40px;padding:0 18px;font-size:14.5px}
.iconbtn{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted-fg)}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.iconbtn[aria-pressed="true"]{background:var(--gold-soft);color:var(--fg)}
.iconbtn.bordered{border:1px solid var(--border);background:var(--raised)}
.field{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r);background:var(--raised);border:1px solid var(--border);color:var(--muted-fg)}
.field:focus-within{border-color:var(--ring)}
.field input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--fg)}
.field input::placeholder{color:var(--faint-fg)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--hover);gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--muted-fg);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
select.sel{height:34px;border-radius:var(--r);border:1px solid var(--border);background:var(--raised);padding:0 10px;min-width:0;width:100%}
.switch{width:36px;height:20px;border-radius:10px;background:var(--input);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.label{font-size:12px;color:var(--faint-fg);letter-spacing:.04em}
.muted{color:var(--muted-fg)}
.faint{color:var(--faint-fg)}

/* ---------- 消息页 ---------- */
.main{flex:1;min-width:0;display:flex;min-height:0}
.listcol{width:300px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.listhead{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.listhead .row{display:flex;align-items:center;justify-content:space-between}
h1.ttl{font-size:22px;font-weight:700;margin:0;letter-spacing:.01em}
.convs{flex:1;overflow-y:auto;padding:4px 8px 12px}
.conv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:10px;position:relative}
.conv:hover{background:var(--hover)}
.conv[aria-current="true"]{background:var(--gold-tint)}
.conv .meta{flex:1;min-width:0}
.conv .l1{display:flex;align-items:baseline;gap:6px}
.conv .name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.conv .time{font-size:11.5px;color:var(--faint-fg);flex:none;font-variant-numeric:tabular-nums}
.conv .l2{display:flex;align-items:center;gap:6px;margin-top:1px}
.conv .pv{font-size:12.5px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.conv .pv.draft b{color:var(--danger);font-weight:500}
.conv .livetag{font-size:11px;font-weight:600;color:var(--danger);display:inline-flex;align-items:center;gap:4px;flex:none}
.conv .livetag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--danger)}
.conv .flags{display:flex;gap:4px;align-items:center;color:var(--faint-fg)}
.conv .flags svg{width:13px;height:13px}
.sect-lbl{padding:10px 10px 4px;font-size:11.5px;color:var(--faint-fg);letter-spacing:.06em}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--muted-fg);padding:40px 24px;flex:1}
.empty .ico{width:48px;height:48px;border-radius:14px;background:var(--hover);display:grid;place-items:center;color:var(--faint-fg)}
.empty h3{margin:0;font-size:15px;color:var(--fg)}

.chat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.chathead{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;border-bottom:1px solid var(--border)}
.chathead .t{flex:1;min-width:0}
.chathead h2{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .sub{font-size:12.5px;color:var(--muted-fg)}
.chathead .acts{display:flex;gap:4px;align-items:center}
.back-m{display:none}
.banner{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:13px;border-bottom:1px solid var(--border)}
.banner.pin{background:var(--gold-tint);color:var(--fg)}
.banner.pin svg{color:var(--gold-ink)}
.banner.live{background:var(--raised)}
.banner.live .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none}
.banner.net{background:var(--warn-soft);color:var(--warn)}
.banner.net.off{background:var(--danger-soft);color:var(--danger)}
.banner .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:12px 20px 8px;display:flex;flex-direction:column}
.day{align-self:center;font-size:12px;color:var(--faint-fg);padding:12px 0 6px}
.msg{display:flex;gap:10px;padding-top:12px;max-width:100%}
.msg.cont{padding-top:3px}
.msg.cont .av{visibility:hidden;height:0}
.msg .col{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:min(560px,78%)}
.msg .who{font-size:12.5px;color:var(--muted-fg);display:flex;gap:8px}
.msg .who b{color:var(--fg);font-weight:600}
.bubble{padding:8px 12px;border-radius:12px;background:var(--raised);border:1px solid var(--border);font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;width:fit-content;max-width:100%}
.bubble .at{color:var(--gold-ink);font-weight:600}
.msg.mine{flex-direction:row-reverse}
.msg.mine .col{align-items:flex-end}
.msg.mine .bubble{background:var(--gold-tint);border-color:transparent}
.msg.mine .av{display:none}
.msg .status{font-size:11.5px;color:var(--faint-fg);display:inline-flex;align-items:center;gap:4px}
.msg .status svg{width:13px;height:13px}
.msg .status.failed{color:var(--danger)}
.msg .status.failed button{color:var(--danger);text-decoration:underline;font-size:11.5px}
.msg.failed .bubble{border:1px dashed var(--danger);background:transparent}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--input);border-top-color:var(--muted-fg);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;width:360px;max-width:100%}
.fileico{width:40px;height:46px;border-radius:6px;display:grid;place-items:end center;padding-bottom:5px;font-size:9.5px;font-weight:800;color:#fff;flex:none;letter-spacing:.03em}
.fileico.pdf{background:#D64A3F}.fileico.xls{background:#2F8F5B}.fileico.doc{background:#3B6FD4}.fileico.img{background:#8E6BD6}.fileico.zip{background:#7A746A}
.card .meta{flex:1;min-width:0}
.card .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sz{font-size:12px;color:var(--muted-fg)}
.prog{height:4px;border-radius:2px;background:var(--hover);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .2s}
.card.req{flex-direction:column;align-items:stretch;gap:10px;border-color:var(--gold)}
.card.req .top{display:flex;gap:12px;align-items:center}
.card.req .acts{display:flex;gap:8px;justify-content:flex-end}
.card.meet .mi{width:42px;height:42px;border-radius:10px;background:var(--gold-soft);display:grid;place-items:center;color:var(--gold-ink);flex:none}
.card.ended{opacity:.7}
.sysmsg{align-self:center;font-size:12px;color:var(--faint-fg);padding:10px 0 2px}
.composer-wrap{padding:8px 20px 16px;flex:none}
.pending-file{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:var(--raised);border:1px solid var(--border)}
.pending-file .meta{flex:1;min-width:0;font-size:13px}
.composer{border:1px solid var(--input);border-radius:var(--r-lg);background:var(--raised);padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px}
.composer:focus-within{border-color:var(--ring)}
.composer textarea{border:0;outline:0;resize:none;background:transparent;min-height:24px;max-height:160px;font-size:14.5px;line-height:1.55}
.composer textarea::placeholder{color:var(--faint-fg)}
.composer .bar{display:flex;align-items:center;gap:2px}
.composer .bar .hint{font-size:11.5px;color:var(--faint-fg);margin-left:auto;margin-right:10px}
.sendbtn{width:36px;height:32px;border-radius:8px;background:var(--gold);color:var(--gold-fg);display:grid;place-items:center}
.sendbtn:disabled{background:var(--hover);color:var(--faint-fg)}

.details{width:280px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.details .hd{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;border-bottom:1px solid var(--border);font-weight:600}
.details .bd{flex:1;overflow-y:auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:18px}
.dsec{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:3px 0}
.mrow .nm{flex:1;min-width:0}
.mrow .role{font-size:11.5px;color:var(--faint-fg)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;cursor:pointer}
.frow{display:flex;align-items:center;gap:10px;font-size:13px}
.frow .fileico{width:28px;height:32px;font-size:7.5px;padding-bottom:3px;border-radius:4px}

/* ---------- 通用内容页 ---------- */
.page{flex:1;min-width:0;overflow-y:auto}
.page-in{max-width:960px;margin:0 auto;padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px}
.page-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-hd p{margin:4px 0 0;color:var(--muted-fg)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigcard{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;display:flex;gap:14px;align-items:flex-start}
.bigcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.bigcard .ic.gold{background:var(--gold);color:var(--gold-fg)}
.bigcard .ic.soft{background:var(--hover);color:var(--fg)}
.bigcard h3{margin:0 0 2px;font-size:16px}
.bigcard p{margin:0 0 12px;font-size:13px;color:var(--muted-fg)}
.bigcard .join{display:flex;gap:8px}
.bigcard .join .field{flex:1}
.list{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--border)}
.lrow:first-child{border-top:0}
.lrow .meta{flex:1;min-width:0}
.lrow .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.lrow .sub{font-size:12.5px;color:var(--muted-fg)}
.livebadge{font-size:11px;font-weight:700;color:var(--danger);background:var(--danger-soft);padding:1px 7px;border-radius:5px}
.h3{font-size:13px;font-weight:600;color:var(--muted-fg);margin:0 0 -12px;letter-spacing:.04em}

/* 通讯录 */
.dir{display:flex;flex:1;min-width:0;min-height:0}
.deptcol{width:220px;flex:none;border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.deptcol .ttl{padding:0 8px 12px}
.dept{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted-fg);text-align:left;width:100%}
.dept:hover{background:var(--hover);color:var(--fg)}
.dept[aria-current="true"]{background:var(--gold-tint);color:var(--fg);font-weight:600}
.dept span:last-child{font-size:12px;color:var(--faint-fg);font-variant-numeric:tabular-nums}
.peoplecol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.peoplecol .hd{padding:16px 20px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)}
.peoplecol .hd .field{flex:1;max-width:380px}
.people{flex:1;overflow-y:auto;padding:8px 12px 16px}
.person{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;width:100%;text-align:left}
.person:hover{background:var(--hover)}
.person[aria-current="true"]{background:var(--gold-tint)}
.person .meta{flex:1;min-width:0}
.person .nm{font-weight:600}
.person .sub{font-size:12.5px;color:var(--muted-fg)}
.stlabel{font-size:12px;color:var(--muted-fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stlabel i{width:7px;height:7px;border-radius:50%;display:block}
.profile{width:320px;flex:none;border-left:1px solid var(--border);padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;overflow-y:auto}
.profile h2{margin:4px 0 0;font-size:20px}
.profile .acts{display:flex;gap:8px;width:100%}
.profile .acts .btn{flex:1}
.kv{width:100%;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:8px 12px;font-size:13.5px;padding-top:14px;border-top:1px solid var(--border)}
.kv dt{color:var(--faint-fg)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* 设置 */
.settings{display:flex;flex:1;min-width:0;min-height:0}
.settabs{width:220px;flex:none;border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.settabs .ttl{padding:0 8px 12px}
.settab{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted-fg);text-align:left;width:100%}
.settab:hover{background:var(--hover);color:var(--fg)}
.settab[aria-current="true"]{background:var(--gold-tint);color:var(--fg);font-weight:600}
.settab.dev{margin-top:auto;font-size:12.5px}
.setbody{flex:1;min-width:0;overflow-y:auto}
.setbody .in{max-width:640px;padding:28px 32px 48px;display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:8px}
.group > .label{padding-left:2px}
.box{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg)}
.srow{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--border)}
.srow:first-child{border-top:0}
.srow .meta{flex:1;min-width:0}
.srow .nm{font-size:14px}
.srow .sub{font-size:12.5px;color:var(--muted-fg)}
.srow .ctl{flex:none;width:220px}
.srow .ctl.auto{width:auto}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.55}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--hover);color:var(--muted-fg)}
.note svg{margin-top:1px}
pre.diag{margin:0;font:12px/1.6 var(--mono);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;color:var(--muted-fg)}

/* ---------- 会议舞台 ---------- */
.meeting{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--stage);color:var(--stage-fg);min-height:0}
.mtop{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px}
.mtop h2{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.mtop .vsep{width:1px;height:18px;background:var(--stage-border)}
.mtop .q{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--stage-muted);white-space:nowrap}
.mtop .q.good svg{color:#5BC17F}
.mtop .q.bad{color:#F0B04A}
.mtop .q.off{color:#F07F73}
.mtop .timer{font-size:13px;color:var(--stage-muted);font-variant-numeric:tabular-nums}
.mtop .grow{flex:1}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--stage-2);border:1px solid var(--stage-border);color:var(--stage-fg);font-size:13px;white-space:nowrap}
.sbtn:hover{background:var(--stage-3)}
.sbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.sharing-bar{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:8px 8px 8px 14px;border-radius:10px;background:var(--gold);color:var(--gold-fg);font-size:13.5px;font-weight:600}
.sharing-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sharing-bar .stop{background:var(--stage);color:var(--stage-fg);height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600}
.recon{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:8px 14px;border-radius:10px;background:#3A2C12;color:#F5C770;font-size:13px}
.recon.off{background:#3A1A16;color:#F4A098}
.mbody{flex:1;min-height:0;display:flex;gap:12px;padding:0 16px 12px}
.stage{flex:1;min-width:0;display:flex;gap:12px;min-height:0}
.sharebox{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--stage-border)}
.sharebox .lab{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:var(--stage-muted);background:var(--stage-2)}
.sharebox .canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;padding:10px}
.slide{width:min(100cqw,160cqh);aspect-ratio:16/10;background:#FAF9F6;color:#161513;border-radius:4px;position:relative;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column;padding:6cqw 6.5cqw}
.slide::after{content:"";position:absolute;right:-8cqw;top:-10cqw;width:30cqw;height:30cqw;border-radius:50%;background:#F5C542;opacity:.25}
.slide .brand{display:flex;align-items:center;gap:1.2cqw;font-weight:800;font-size:2.4cqw}
.slide .brand svg{width:4cqw;height:4cqw}
.slide h1{font-size:5.6cqw;margin:4.5cqw 0 1.2cqw;letter-spacing:.02em}
.slide .bar{width:7cqw;height:.6cqw;background:#F5C542;border-radius:1cqw}
.slide p{font-size:1.9cqw;color:#64615C;margin:2.4cqw 0 0}
.slide .three{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:auto}
.slide .three div{border:1px solid #E3E0DA;border-radius:1cqw;padding:1.8cqw;background:#fff;font-size:1.6cqw;color:#64615C}
.slide .three b{display:block;font-size:2cqw;color:#161513;margin-bottom:.6cqw}
.selfshare{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:12px;border:1px dashed var(--stage-border);color:var(--stage-muted);text-align:center;padding:24px}
.selfshare .mini{width:min(420px,80%);opacity:.9}
.selfshare .mini .slide{width:100%}
.tilerail{width:236px;flex:none;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.tilegrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-content:center;overflow-y:auto}
.tile{position:relative;border-radius:12px;overflow:hidden;background:var(--stage-2);aspect-ratio:16/10;display:grid;place-items:center;border:2px solid transparent;flex:none}
.tilerail .tile{aspect-ratio:auto;flex:1 1 0;min-height:96px;max-height:200px}
.tile.speaking{border-color:var(--gold)}
.tile.cam{background:radial-gradient(120% 90% at 50% 110%,hsl(var(--h) 28% 30%),hsl(var(--h) 18% 14%) 70%)}
.tile .person-sil{width:46%;max-width:150px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 38%,hsl(var(--h) 30% 62%) 0 22%,transparent 23%),radial-gradient(ellipse 60% 48% at 50% 100%,hsl(var(--h) 25% 48%) 0 98%,transparent 100%);opacity:.9}
.tile .av{width:56px;height:56px;font-size:21px}
.tile .nm{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;font-size:12px}
.tile .nm svg{width:13px;height:13px}
.tile .nm .off{color:#F07F73}
.tile .wave{position:absolute;right:8px;bottom:8px;display:flex;gap:2px;align-items:flex-end;height:14px}
.tile .wave i{width:3px;background:var(--gold);border-radius:2px;height:40%}
.tile.speaking .wave i{animation:wv .9s ease-in-out infinite}
.tile .wave i:nth-child(2){animation-delay:.15s}.tile .wave i:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{height:30%}50%{height:100%}}
.tile:not(.speaking) .wave{display:none}
.tile .tag{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:5px;color:var(--stage-muted)}
.mpanel{width:300px;flex:none;background:var(--stage-2);border:1px solid var(--stage-border);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.mpanel .hd{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;font-weight:600;border-bottom:1px solid var(--stage-border)}
.mpanel .bd{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mpanel .prow{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:13.5px}
.mpanel .prow .nm{flex:1;min-width:0}
.mpanel .prow .role{font-size:11.5px;color:var(--stage-muted)}
.mpanel .prow svg{width:16px;height:16px;color:var(--stage-muted)}
.mpanel .prow svg.off{color:#F07F73}
.mpanel .cm{font-size:13px;padding:6px 2px}
.mpanel .cm b{font-weight:600;margin-right:6px}
.mpanel .cm span{color:var(--stage-muted);font-size:11.5px}
.mpanel .ft{padding:10px;border-top:1px solid var(--stage-border)}
.mpanel .ft input{width:100%;height:34px;border-radius:8px;border:1px solid var(--stage-border);background:var(--stage);padding:0 10px;color:var(--stage-fg);outline:0}
.mpanel .iconbtn{color:var(--stage-muted)}
.mpanel .iconbtn:hover{background:var(--stage-3);color:var(--stage-fg)}
.dock{flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px 16px;justify-content:center;position:relative}
.dock .grp{display:flex;gap:8px}
.dock .vsep{width:1px;height:28px;background:var(--stage-border);margin:0 4px}
.dk{height:46px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:10px;background:var(--stage-2);border:1px solid var(--stage-border);color:var(--stage-fg);font-size:13px;white-space:nowrap}
.dk:hover{background:var(--stage-3)}
.dk.split{padding:0;gap:0}
.dk.split > button{height:100%;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-radius:10px 0 0 10px}
.dk.split > button.caret{padding:0 8px;border-left:1px solid var(--stage-border);border-radius:0 10px 10px 0;color:var(--stage-muted)}
.dk.split > button:hover{background:var(--stage-3)}
.dk.off svg.main{color:#F07F73}
.dk[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.dk.leave{background:var(--danger);border-color:var(--danger);color:#fff;position:absolute;right:16px}
.dk.leave:hover{filter:brightness(1.05);background:var(--danger)}
.dk .cnt{font-variant-numeric:tabular-nums;color:var(--stage-muted)}

/* 迷你会议条（最小化后） */
.minicall{position:absolute;right:16px;bottom:16px;z-index:30;background:var(--stage);color:var(--stage-fg);border-radius:14px;box-shadow:var(--shadow-pop);padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;border:1px solid var(--stage-border)}
.minicall .t{display:flex;flex-direction:column;line-height:1.3}
.minicall .t b{font-size:13.5px}
.minicall .t span{font-size:12px;color:var(--stage-muted);font-variant-numeric:tabular-nums}
.minicall .mb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--stage-2)}
.minicall .mb.off{color:#F07F73}
.minicall .mb.leave{background:var(--danger);color:#fff}
.minicall .ret{height:34px;padding:0 12px;border-radius:9px;background:var(--gold);color:var(--gold-fg);font-weight:600;font-size:13px}

/* ---------- 浮层 ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(22,21,19,.38);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--raised);color:var(--fg);border-radius:14px;box-shadow:var(--shadow-pop);width:min(760px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:22px 22px 6px}
.modal .mh h2{margin:0;font-size:19px}
.modal .mh p{margin:2px 0 0;color:var(--muted-fg);font-size:13px}
.modal .mh .grow{flex:1}
.modal .mb{padding:12px 22px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:14px 22px 20px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--border)}
.modal .mf .grow{flex:1}
.srcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.src{border:1.5px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--bg);position:relative}
.src:hover{border-color:var(--faint-fg)}
.src[aria-checked="true"]{border-color:var(--gold);background:var(--gold-tint)}
.src .chk{z-index:2;position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-fg);display:none;place-items:center}
.src[aria-checked="true"] .chk{display:grid}
.src .chk svg{width:14px;height:14px;stroke-width:2.6}
.src .cap{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.src .cap small{font-weight:400;color:var(--muted-fg)}
.thumb{aspect-ratio:16/7.5;border-radius:7px;background:#fff;border:1px solid #E3E0DA;overflow:hidden;position:relative;display:flex;flex-direction:column}
.thumb .tb{height:9%;min-height:8px;background:#F0EEEA;display:flex;gap:3px;align-items:center;padding:0 5px}
.thumb .tb i{width:5px;height:5px;border-radius:50%;background:#D9D5CD}
.thumb .tc{flex:1;display:flex;gap:6%;padding:6%}
.thumb .ln{height:5px;border-radius:3px;background:#E8E5DF;margin-bottom:5px}
.thumb .ln.g{background:#F5C542;opacity:.7}
.thumb.desk{background:linear-gradient(135deg,#2C2A26,#161513)}
.thumb.desk .win{position:absolute;background:#FAF9F6;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.chkrow{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.chkbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--input);display:grid;place-items:center;flex:none;background:var(--raised)}
.chkbox[aria-checked="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-fg)}
.chkbox svg{width:12px;height:12px;stroke-width:3;display:none}
.chkbox[aria-checked="true"] svg{display:block}
.prejoin{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.preview{aspect-ratio:16/10;border-radius:12px;background:var(--stage);color:var(--stage-fg);display:grid;place-items:center;position:relative;overflow:hidden;--h:40}
.preview.cam{background:radial-gradient(120% 90% at 50% 110%,hsl(40 28% 32%),hsl(40 18% 13%) 70%)}
.preview .person-sil{width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 38%,hsl(40 30% 64%) 0 22%,transparent 23%),radial-gradient(ellipse 60% 48% at 50% 100%,hsl(40 25% 50%) 0 98%,transparent 100%)}
.preview .ctrls{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.preview .ctrls button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.preview .ctrls button.off{background:var(--danger)}
.preview .camoff{font-size:12.5px;color:var(--stage-muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.meter{display:flex;gap:3px;height:12px;align-items:flex-end}
.meter i{width:5px;height:100%;border-radius:2px;background:var(--border)}
.meter i.on{background:var(--ok)}
.fgrp{display:flex;flex-direction:column;gap:6px}
.fgrp label{font-size:12.5px;color:var(--muted-fg)}
.pop{position:absolute;z-index:50;background:var(--raised);color:var(--fg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;min-width:220px}
.pop .pi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13.5px;text-align:left}
.pop .pi:hover{background:var(--hover)}
.pop .pi.danger{color:var(--danger)}
.pop .pi .grow{flex:1}
.pop .ph{padding:8px 10px 4px;font-size:11.5px;color:var(--faint-fg);letter-spacing:.04em}
.pop .pd{height:1px;background:var(--border);margin:4px 6px}
.pop .emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.pop .emo button{font-size:20px;height:34px;border-radius:7px}
.pop .emo button:hover{background:var(--hover)}
.palette{position:absolute;inset:0;z-index:60;background:rgba(22,21,19,.3);display:flex;justify-content:center;align-items:flex-start;padding:80px 16px 16px}
.palette .pbox{width:min(560px,100%);background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-pop);overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--muted-fg)}
.palette .pin input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--fg)}
.palette .res{max-height:360px;overflow-y:auto;padding:6px}
.palette .pr{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.palette .pr[aria-selected="true"]{background:var(--gold-tint)}
.palette .pr .meta{flex:1;min-width:0}
.palette .pr .sub{font-size:12px;color:var(--muted-fg)}
.palette .pr .k{font-size:11.5px;color:var(--faint-fg)}
.palette .pfoot{padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--faint-fg);display:flex;gap:14px}
.toasts{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:9px;box-shadow:var(--shadow-pop);animation:tin .2s ease-out;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* 登录 */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow-y:auto}
.lcard{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.brandbox{width:48px;height:48px;display:block;flex:none}.brandbox svg{width:100%;height:100%;border-radius:11px}
.lcard .logo svg{width:64px;height:64px;border-radius:15px}
.lcard h1{margin:4px 0 0;font-size:24px}
.lcard p{margin:0;color:var(--muted-fg)}
.lcard .btn.lg{width:100%}
.wslist{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.wsi{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--raised);width:100%;text-align:left}
.wsi:hover{border-color:var(--gold)}
.wsi .meta{flex:1}
.wsi .sub{font-size:12.5px;color:var(--muted-fg)}
.waiting{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--hover);width:100%;font-size:13.5px;text-align:left}
.waiting .spin{width:16px;height:16px;border-width:2px}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--border)}
.steps i.on{background:var(--gold)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- 中等宽度 ---------- */
@media (max-width:1180px){
  .details{position:absolute;right:0;top:40px;bottom:0;z-index:20;box-shadow:var(--shadow-pop)}
  .profile{width:280px}
  .tb-search{min-width:0}
  .tb-search .txt{display:none}
}
@media (max-width:980px){
  .listcol{width:260px}
  .deptcol,.settabs{width:180px}
  .mpanel{position:absolute;right:16px;top:96px;bottom:84px;z-index:20}
  .tilerail{width:180px}
  .dk .lbl{display:none}
  .prejoin{grid-template-columns:1fr}
}

/* ---------- 手机宽度：底部标签栏 + 单列推栈 ---------- */
@media (max-width:760px){
  .shell{padding-left:0;padding-right:0;padding-block:0;gap:0}
  .proto{padding:8px max(16px,env(safe-area-inset-left,0px)) 8px;background:var(--page);border-bottom:1px solid var(--border)}
  .window{border-radius:0;border:0;box-shadow:none}
  .lights,.tb-ws,.tb-search{display:none}
  .titlebar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .body{flex-direction:column-reverse}
  .rail{width:100%;flex-direction:row;justify-content:space-around;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--border)}
  .rail .ws-btn,.rail .grow,.rail .me-btn{display:none}
  .navbtn{width:64px;min-height:48px}
  .main{position:relative}
  .listcol{width:100%;border-right:0}
  .chat{position:absolute;inset:0;z-index:5;display:none}
  .main.m-chat .chat{display:flex}
  .back-m{display:grid}
  .chathead{padding:0 12px 0 8px}
  .chathead .acts .hide-m{display:none}
  .msgs,.composer-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .composer .bar .hint{display:none}
  .details{position:absolute;inset:0;width:auto;z-index:20}
  .page-in{padding:20px max(16px,env(safe-area-inset-left,0px)) 32px}
  .cards2{grid-template-columns:1fr}
  .dir,.settings{flex-direction:column}
  .deptcol,.settabs{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px 12px;gap:6px;flex:none}
  .deptcol .ttl,.settabs .ttl{display:none}
  .dept,.settab{width:auto;white-space:nowrap;flex:none;gap:8px}
  .settab.dev{margin-top:0}
  .peoplecol .hd{padding:12px 16px}
  .profile{position:absolute;inset:0;width:auto;z-index:20;background:var(--bg);border-left:0}
  .setbody .in{padding:20px 16px 32px}
  .srow{flex-wrap:wrap}
  .srow .ctl{width:100%}
  .mtop .hide-m{display:none}
  .mbody{padding:0 12px 8px}
  .stage{flex-direction:column}
  .tilerail{width:auto;flex-direction:row;overflow-x:auto}
  .tilerail .tile{width:120px}
  .tilegrid{grid-template-columns:1fr 1fr}
  .mpanel{left:12px;right:12px;width:auto;top:60px;bottom:76px}
  .dock{justify-content:flex-start;overflow-x:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .dock .vsep{display:none}
  .dk.leave{position:static}
  .dk .lbl{display:none}
  .srcgrid{grid-template-columns:1fr}
  .scrim{padding:12px;align-items:flex-end}
  .minicall{left:12px;right:12px;bottom:72px}
  .minicall .t{flex:1}
}

function lastPreview(c){
  const m=[...c.msgs].reverse().find(x=>x.kind!=='day');
  if(!m) return ['',''];
  const who = m.from==='me'?'我':(c.group?P[m.from].name:'');
  let txt = m.kind==='text'?m.text: m.kind==='file'?`[文件] ${m.file.name}`: m.kind==='filereq'?`[文件] ${m.file.name}`: m.kind==='meet'?`[会议] ${MEETINGS[m.meet]?.title||'会议'}`:'';
  if(m.status==='failed') txt='[发送失败] '+txt;
  return [(who?who+'：':'')+txt, m.t];
}
function visibleConvs(){
  const q=S.query.trim();
  return CONVS.filter(c=>{
    if(S.filter==='unread' && !c.unread) return false;
    if(S.filter==='group' && !c.group) return false;
    if(q){ const hay=c.name+c.msgs.map(m=>m.text||'').join(' '); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>(S.pinned[b.id]?1:0)-(S.pinned[a.id]?1:0));
}

        : f.state==='downloading'?`<button class="btn sm ghost" data-act="dlcancel" data-v="${m.id}">取消</button>`
        : `<button class="btn sm ghost" data-act="openfile" data-v="${m.id}">打开</button>`;
      const sub = f.state==='outgoing'?`${f.size} · 等待对方确认接收`: f.state==='downloading'?`正在接收 ${f.p}% · 完成后校验`: f.state==='saved'?`${f.size} · 已保存到「下载」`: f.size;
      body=`<div class="card"><span class="fileico ${f.type}">${f.type.toUpperCase()}</span><span class="meta"><div class="nm">${esc(f.name)}</div><div class="sz">${esc(sub)}</div>${f.state==='downloading'?`<div class="prog"><i style="width:${f.p}%"></i></div>`:''}</span>${right}</div>`;
    } else if(m.kind==='filereq'){
      const f=m.file;
      if(m.state==='pending') body=`<div class="card req"><div class="top"><span class="fileico ${f.type}">${f.type.toUpperCase()}</span><span class="meta"><div class="nm">${esc(f.name)}</div><div class="sz">${esc(f.size)} · 等你确认后才会开始传输</div></span></div><div class="acts"><button class="btn sm" data-act="freq-no" data-v="${m.id}">拒绝</button><button class="btn sm primary" data-act="freq-yes" data-v="${m.id}">选择位置并接收</button></div></div>`;
      else if(m.state==='rejected') body=`<div class="card ended"><span class="fileico ${f.type}">${f.type.toUpperCase()}</span><span class="meta"><div class="nm">${esc(f.name)}</div><div class="sz">已拒绝接收</div></span></div>`;
      else if(m.state==='receiving') body=`<div class="card"><span class="fileico ${f.type}">${f.type.toUpperCase()}</span><span class="meta"><div class="nm">${esc(f.name)}</div><div class="sz">正在接收 ${m.p}%</div><div class="prog"><i style="width:${m.p}%"></i></div></span><button class="btn sm ghost" data-act="freq-cancel" data-v="${m.id}">取消</button></div>`;
      else body=`<div class="card"><span class="fileico ${f.type}">${f.type.toUpperCase()}</span><span class="meta"><div class="nm">${esc(f.name)}</div><div class="sz">${esc(f.size)} · 校验通过，已保存到「下载」</div></span><button class="btn sm ghost" data-act="openfile">打开</button></div>`;
    } else if(m.kind==='meet'){
      const mt=MEETINGS[m.meet];
      if(mt){
        const inIt=S.call&&S.call.id===mt.id;
        body=`<div class="card meet"><span class="mi">${ic('video')}</span><span class="meta"><div class="nm">${esc(mt.title)}</div><div class="sz">${inIt?'你已在会议中':`${mt.people.length} 人正在会议中`}</div></span>${inIt?`<button class="btn sm" data-act="restore">回到会议</button>`:`<button class="btn sm primary" data-act="join" data-v="${mt.id}">加入会议</button>`}</div>`;
      } else body=`<div class="card meet ended"><span class="mi">${ic('video')}</span><span class="meta"><div class="nm">${esc(m.title||'会议')}</div><div class="sz">已结束 · ${esc(m.dur||'')}</div></span></div>`;
    }
    let status='';
    if(mine){
      if(m.status==='sending') status=`<span class="status"><span class="spin" aria-hidden="true"></span>发送中</span>`;
      else if(m.status==='failed') status=`<span class="status failed">${ic('alert')}发送失败 · <button data-act="retry" data-v="${m.id}">重试</button></span>`;
      else if(m.status==='sent' && m===lastMine(c)) status=`<span class="status">${ic('check')}已送出</span>`;
    }
    out.push(`<div class="msg ${mine?'mine':''} ${cont?'cont':''} ${m.status==='failed'?'failed':''}">
      ${mine?'':av(m.from)}
      <div class="col">
        ${!cont && !mine?`<div class="who"><b>${esc(P[m.from].name)}</b><span>${esc(m.t)}</span></div>`:''}
        ${!cont && mine?`<div class="who"><span>${esc(m.t)}</span></div>`:''}
        ${body}${status}
      </div></div>`);
    prev=m;
  }
  el.innerHTML=out.join('');
  el.scrollTop=el.scrollHeight;
}

function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0');}
function tile(k,{cam,mic,speaking,tag}={}){
  const p=P[k];
  return `<div class="tile ${cam?'cam':''} ${speaking?'speaking':''}" style="--h:${p.h}" data-k="${k}">
    ${cam?'<div class="person-sil" aria-hidden="true"></div>':av(k)}
    ${tag?`<span class="tag">${tag}</span>`:''}
    <span class="nm">${mic?'':ic('micoff','off')}${k==='me'?'我':esc(p.name)}</span>
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i></span></div>`;
}
function participants(){
  const m=MEETINGS[S.call.id]; const arr=[...m.people.filter(k=>k!=='me'),'me'];
  const camOn={lx:true,cm:true,wl:true,fy:true,hc:false};
  const micOn={lx:true,cm:false,wl:false,fy:true,hc:false};
  return arr.map(k=>k==='me'?{k,cam:S.call.cam,mic:S.call.mic}:{k,cam:!!camOn[k],mic:!!micOn[k]});
}
function renderMeeting(){
  const c=S.call, m=MEETINGS[c.id];
  const ps=participants();
  const speaker=c.speaker||m.host;
  const remote=!c.sharing && m.remoteShare;
  const shareMode=(remote||c.sharing) && c.layout!=='grid';
  const q = S.net==='online'?`<span class="q good">${ic('signal')}网络良好</span>`:S.net==='reconnecting'?`<span class="q bad">${ic('signal')}正在重连</span>`:`<span class="q off">${ic('wifioff')}连接中断</span>`;
  let stage='';
  if(shareMode){
    const box = c.sharing
      ? `<div class="selfshare"><div class="mini">${slideHTML()}</div><div><b style="color:var(--stage-fg)">你正在共享「${esc(c.sharing.name)}」</b><br>其他人看到的是上面的画面。切换到别的窗口不会被共享。</div></div>`
      : `<div class="sharebox"><div class="lab">${ic('monitor')}${esc(P[remote.by].name)}正在共享 · ${esc(remote.what)}</div><div class="canvas">${slideHTML()}</div></div>`;

}
function palGo(v){
  const [t,id]=v.split(':'); $('#palette').innerHTML='';
  if(t==='conv') openConv(id);
  if(t==='person') startDM(id);
  if(t==='act'&&id==='new-meet') newMeeting();
  if(t==='act'&&id==='settings') go('settings');
}

/* ================= 渲染入口 ================= */
function render(){
  renderTitlebar();
  const b=$('#body');
  if(S.screen==='login'){ b.innerHTML=renderLogin(); renderOverlay(); renderMini(); syncProto(); return; }
  if(S.call && !S.call.min){ b.innerHTML=renderMeeting(); }
  else {
    let v='';
    if(S.view==='messages') v=renderMessagesView();
    if(S.view==='meetings') v=renderMeetingsView();
    if(S.view==='contacts') v=renderContactsView();
    if(S.view==='settings') v=renderSettingsView();
    b.innerHTML=renderRail()+v;
    if(S.view==='messages'){renderConvList();renderMsgList();renderPending();autosize();updateSend();}
  }
  renderOverlay(); renderMini(); syncProto();
}
function renderLogin(){
  const st=S.loginStep;
  let inner='';
  if(st===0) inner=`<h1>吉吉 · 团队协同</h1><p>团队消息、会议和屏幕共享。</p><button class="btn primary lg" data-act="login-start" style="margin-top:8px">使用企业账号登录</button><p class="faint" style="font-size:12.5px">会在系统浏览器中打开登录页，本应用不会看到你的密码。</p>`;
  if(st===1) inner=`<h1>在浏览器中完成登录</h1><p>登录完成后会自动回到这里。</p><div class="waiting"><span class="spin" aria-hidden="true"></span><span style="flex:1">正在等待浏览器返回…</span></div><div style="display:flex;gap:8px;width:100%"><button class="btn" style="flex:1" data-act="toast" data-v="已重新打开浏览器">重新打开浏览器</button><button class="btn" style="flex:1" data-act="login-cancel">取消</button></div>`;
  if(st===2) inner=`<h1>选择工作区</h1><p>你好，${P.me.name}。你属于以下工作区：</p><div class="wslist">${WS.map(w=>`<button class="wsi" data-act="login-ws" data-v="${w.id}"><span class="av sq" style="--h:${w.h}">${w.name[0]}</span><span class="meta"><b>${esc(w.name)}</b><div class="sub">${w.members} 位成员 · ${w.role}</div></span>${ic('right')}</button>`).join('')}</div><button class="btn ghost sm" data-act="login-cancel">换个账号</button>`;
  return `<div class="login"><div class="lcard"><span class="logo">${BRAND}</span>${inner}<div class="steps" aria-hidden="true"><i class="${st>=0?'on':''}"></i><i class="${st>=1?'on':''}"></i><i class="${st>=2?'on':''}"></i></div></div></div>`;
}
function syncProto(){
  const scn = S.screen==='login'?'login': S.picker?'picker': S.prejoin?'prejoin': (S.call&&!S.call.min)?(S.call.sharing?'call-self':'call-remote'): S.view;
  document.querySelectorAll('[data-act="scn"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===scn));
  document.querySelectorAll('[data-act="net"].pchip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.net));
  document.querySelectorAll('[data-act="theme"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.theme));
}

/* ================= 动作 ================= */
function go(view){S.view=view;S.mobileChat=false;S.details=S.details&&view==='messages';if(S.call)S.call.min=true;render();}
function saveDraft(){const t=$('#composer');if(t&&S.conv)S.drafts[S.conv]=t.value;}
function openConv(id){saveDraft();S.view='messages';S.conv=id;const c=conv(id);c.unread=0;S.mobileChat=true;S.pendingFile=null;if(S.call)S.call.min=true;render();setTimeout(()=>$('#composer')?.focus(),0);}
function startDM(k){
  let c=CONVS.find(x=>x.dm===k);
  if(!c){c={id:'d'+k,name:P[k].name,dm:k,unread:0,msgs:[{kind:'sys',text:`和 ${P[k].name} 的私聊从这里开始`}]};CONVS.push(c);}
  openConv(c.id);
}
function nowT(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function send(){
  const t=$('#composer'); const text=t.value.trim(); if(!text) return;
  const c=conv(S.conv); const last=c.msgs[c.msgs.length-1];
  if(!last||last.kind!=='day'||last.text!=='今天'){ if(!c.msgs.some(m=>m.kind==='day'&&m.text==='今天')) c.msgs.push({kind:'day',text:'今天'}); }
  const m=M('me',nowT(),text,{status:'sending'}); c.msgs.push(m);
  t.value=''; S.drafts[S.conv]=''; c.draft=''; autosize(); updateSend();
  renderMsgList(); renderConvList();
  deliver(m);
}
function deliver(m){
  setTimeout(()=>{m.status = S.net==='online'?'sent':'failed'; renderMsgList(); renderConvList(); if(m.status==='failed') toast('消息没有发出去，联网后点「重试」');},S.net==='online'?700:1200);
}
function autosize(){const t=$('#composer');if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';}
function updateSend(){const t=$('#composer'),b=$('#sendbtn');if(t&&b)b.disabled=!t.value.trim();}
function joinMeeting(id){
  const m=MEETINGS[id];
  S.prejoin={id,title:m.title,sub:`来自「${conv(m.conv).name}」 · 主持人 ${P[m.host].name}`,people:m.people.length,mic:!S.prefs.micOff,cam:!S.prefs.camOff,camDev:'facetime'};
  closePop(); render();
}
function newMeeting(fromConv){
  const id='m'+Date.now(); const c=conv(fromConv)||null;
  const title=c?(c.dm?`与 ${P[c.dm].name} 的会议`:`${c.name} 的会议`):`${P.me.name}的会议`;
  MEETINGS[id]={id,title,conv:c?c.id:'c1',host:'me',people:[],startedMin:0,remoteShare:null,isNew:true};
  S.prejoin={id,title,sub:c?`会在「${c.name}」里发出会议卡片，成员可一键加入`:'开始后可以复制会议链接邀请别人',people:0,mic:!S.prefs.micOff,cam:!S.prefs.camOff,camDev:'facetime',isNew:true};
  closePop(); render();
}
function enterCall(){
  const p=S.prejoin, m=MEETINGS[p.id];
  S.call={id:p.id,start:Date.now()-(m.startedMin*60+Math.floor(Math.random()*50))*1000,mic:p.mic,cam:p.cam&&p.camDev!=='denied',sharing:null,layout:'speaker',panel:null,min:false,speaker:m.host,
    chat:p.id==='m1'?[{from:'lx',t:'10:31',text:'我先共享设计稿，大家看第 2 页。'},{from:'cm',t:'10:32',text:'收到'}]:[]};
  if(p.isNew){ const c=conv(m.conv); if(c){ c.msgs.push({id:msgId(),from:'me',t:nowT(),kind:'meet',meet:m.id}); } }
  S.prejoin=null; render(); toast(p.isNew?'会议已开始，会议卡片已发到会话':'已加入会议');
}
function leaveCall(endAll){
  const m=MEETINGS[S.call.id]; const title=m.title;
  if(m.isNew||endAll){ delete MEETINGS[S.call.id]; const c=conv(m.conv); if(c){ c.msgs.forEach(x=>{if(x.kind==='meet'&&x.meet===m.id){x.title=title;x.dur=fmtDur(Date.now()-S.call.start);}}); if(c.live===m.id) c.live=null; } }
  S.call=null; S.picker=null; closePop(); render(); toast(endAll?'已为所有人结束会议':`已离开「${title}」`);
}

const ACT = {
  scn(v){
    closePop(); S.prejoin=null; S.picker=null;
    if(v==='login'){S.screen='login';S.loginStep=0;S.call=null;render();return;}
    S.screen='app';
    if(['messages','meetings','contacts','settings'].includes(v)){ if(S.call) S.call.min=true; S.view=v; if(v==='messages'){S.conv='c1';S.mobileChat=false;} render(); return; }
    if(v==='prejoin'){ S.call=null; S.view='messages'; S.conv='c1'; render(); joinMeeting('m1'); return; }
    if(v==='call-remote'||v==='call-self'||v==='picker'){
      if(!S.call||S.call.id!=='m1'){ S.prejoin={id:'m1',mic:true,cam:true,camDev:'facetime',title:'设计走查'}; enterCall(); }
      S.call.min=false; S.call.layout='speaker';
      S.call.sharing = v==='call-self'?{id:'w1',name:'协同端设计稿',kind:'window',audio:false}:null;
      if(v==='picker') S.picker={kind:'window',sel:'w1',audio:false};
      render(); return;
    }
  },
  net(v){S.net=v; render(); if(v==='online') toast('已重新连接'); },
  theme(v){S.theme=v; if(v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); syncProto();},
  view(v,el){ if(el?.dataset.tab) S.setTab=el.dataset.tab; closePop(); go(v); },
  open(v){openConv(v);},
  mback(){saveDraft();S.mobileChat=false;S.details=false;render();},
  filter(v){S.filter=v;document.querySelectorAll('[data-act="filter"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));renderConvList();},
  details(){saveDraft();S.details=!S.details;render();},
  send(){send();},
  retry(v){const c=conv(S.conv);const m=c.msgs.find(x=>x.id==+v);if(!m)return;if(S.net!=='online'){toast('仍处于离线，恢复网络后再试');return;}m.status='sending';renderMsgList();deliver(m);},
  attach(){S.pendingFile={name:'登录页走查记录.pdf',type:'pdf',size:'812 KB'};renderPending();},
  'pf-cancel'(){S.pendingFile=null;renderPending();},
  'pf-send'(){const c=conv(S.conv);const f=S.pendingFile;S.pendingFile=null;renderPending();c.msgs.push({id:msgId(),from:'me',t:nowT(),kind:'file',file:{...f,state:'outgoing',p:0},status:'sent'});renderMsgList();renderConvList();toast('已发出，等对方确认接收');},
  dl(v){const m=conv(S.conv).msgs.find(x=>x.id==+v);if(S.net!=='online'){toast('离线时无法下载');return;}m.file.state='downloading';m.file.p=0;renderMsgList();
    const tick=setInterval(()=>{if(m.file.state!=='downloading'){clearInterval(tick);return;}m.file.p=Math.min(100,m.file.p+12+Math.floor(Math.random()*14));if(m.file.p>=100){m.file.state='saved';clearInterval(tick);toast('已保存到「下载」');}renderMsgList();},260);},
  dlcancel(v){const c=conv(S.conv);const m=c.msgs.find(x=>x.id==+v);if(m.file.state==='outgoing'){c.msgs.splice(c.msgs.indexOf(m),1);renderMsgList();renderConvList();toast('已撤回，对方不会收到文件');return;}m.file.state='idle';m.file.p=0;renderMsgList();toast('已取消下载');},
  openfile(){toast('已用默认应用打开');},
  'freq-yes'(v){const m=conv(S.conv).msgs.find(x=>x.id==+v);m.state='receiving';m.p=0;renderMsgList();const tick=setInterval(()=>{if(m.state!=='receiving'){clearInterval(tick);return;}m.p=Math.min(100,m.p+20);if(m.p>=100){m.state='saved';clearInterval(tick);toast('接收完成，校验通过');}renderMsgList();},300);},
  'freq-no'(v){const m=conv(S.conv).msgs.find(x=>x.id==+v);m.state='rejected';renderMsgList();},
  'freq-cancel'(v){const m=conv(S.conv).msgs.find(x=>x.id==+v);m.state='pending';renderMsgList();toast('已取消，未完成的文件不会保留');},
  emoji(v){const t=$('#composer');if(t){t.value+=v;t.focus();autosize();updateSend();}closePop();},
  mention(){const t=$('#composer');if(t){t.value+='@';t.focus();updateSend();}},
  'toggle-mute'(){const c=conv(S.conv);S.muted[c.id]=!(S.muted[c.id]??c.muted);saveDraft();render();},
  'toggle-pin'(){const c=conv(S.conv);S.pinned[c.id]=!S.pinned[c.id];saveDraft();render();},
  'call-audio'(){toast('语音通话会以「仅音频」进入会前检查');newMeeting(S.conv);S.prejoin.cam=false;renderOverlay();},
  'start-meet'(v){saveDraft();newMeeting(v);},
  'new-meet'(){newMeeting();},
  join(v){saveDraft();if(S.call&&S.call.id===v){S.call.min=false;render();return;}if(S.call){toast('请先离开当前会议');return;}joinMeeting(v);},
  'join-code'(){const v=($('#mcode')?.value||'').replace(/\s/g,'');if(!/^\d{9}$/.test(v)){toast('会议号是 9 位数字');return;}joinMeeting('m2');},
  'prejoin-cancel'(){if(S.prejoin?.isNew)delete MEETINGS[S.prejoin.id];S.prejoin=null;render();},
  'scrim-prejoin'(v,el,e){if(e.target===el)ACT['prejoin-cancel']();},
  'pj-mic'(){S.prejoin.mic=!S.prejoin.mic;renderOverlay();},
  'pj-cam'(){S.prejoin.cam=!S.prejoin.cam;renderOverlay();},
  'prejoin-go'(){enterCall();},
  restore(){if(S.call){S.call.min=false;render();}},
  minimize(){S.call.min=true;closePop();render();},
  mic(){S.call.mic=!S.call.mic;closePop();render();toast(S.call.mic?'麦克风已打开':'已静音');},
  cam(){S.call.cam=!S.call.cam;closePop();render();},
  layout(){S.call.layout=S.call.layout==='grid'?'speaker':'grid';render();},
  mpanel(v){S.call.panel=S.call.panel===v?null:v;render();if(S.call.panel==='chat')setTimeout(()=>$('#mchatin')?.focus(),0);},
  'open-picker'(){S.picker={kind:'window',sel:null,audio:false};renderOverlay();},
  'picker-close'(){S.picker=null;renderOverlay();},
  'scrim-picker'(v,el,e){if(e.target===el)ACT['picker-close']();},
  'pk-kind'(v){S.picker.kind=v;S.picker.sel=null;renderOverlay();},
  'pk-sel'(v){S.picker.sel=v;renderOverlay();},
  'pk-audio'(){S.picker.audio=!S.picker.audio;renderOverlay();},
  'pk-start'(){const k=S.picker.kind;const s=SOURCES[k].find(x=>x.id===S.picker.sel);S.call.sharing={...s,kind:k,audio:S.picker.audio};S.call.layout='speaker';S.picker=null;render();toast(k==='window'?'仅共享选中的窗口':'正在共享整个屏幕');},
  'stop-share'(){S.call.sharing=null;closePop();render();toast('已停止共享');},
  'stop-all'(){S.call.mic=false;S.call.cam=false;S.call.sharing=null;closePop();render();toast('已停止麦克风、摄像头和共享');},
  leave(){leaveCall(false);},
  'end-all'(){leaveCall(true);},
  'copy-link'(){const t='https://l.maplayer.top/m/482913076';if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('会议链接已复制'),()=>toast(t));else toast(t);},
  pop(v,el){openPop(v,el);},
  palette(){openPalette();},
  'pal-scrim'(v,el,e){if(e.target===el)$('#palette').innerHTML='';},
  'pal-go'(v){palGo(v);},
  dept(v){S.dept=v;render();},
  person(v){S.person=v;render();},
  'person-close'(){S.person=null;render();},
  dm(v){startDM(v);},
  'dm-meet'(v){startDM(v);newMeeting(S.conv);},
  settab(v){S.setTab=v;render();},
  pref(v){S.prefs[v]=!S.prefs[v];render();},
  'diag-open'(){S.diagOpen=true;render();},
  'check-update'(el){const b=$('#updbtn');b.innerHTML='<span class="spin"></span>检查中';b.disabled=true;setTimeout(()=>{b.disabled=false;b.textContent='检查更新';toast('已是最新版本 0.1.0');},900);},
  'ws-switch'(v){closePop();const w=WS.find(x=>x.id===v);toast(`切换到「${w.name}」需要重新验证身份（原型未切换）`);},
  'me-status'(v){P.me.status=v;closePop();render();},
  logout(){closePop();S.call=null;S.prejoin=null;S.picker=null;S.screen='login';S.loginStep=0;render();},
  'login-start'(){S.loginStep=1;render();clearTimeout(ACT._lt);ACT._lt=setTimeout(()=>{if(S.screen==='login'&&S.loginStep===1){S.loginStep=2;render();}},1800);},
  'login-cancel'(){S.loginStep=0;render();},
  'login-ws'(){S.screen='app';S.view='messages';S.conv='c1';render();toast('已进入「吉吉产品研发」');},
  toast(v){toast(v);closePop();},
  noop(){closePop();},
};

/* ================= 事件 ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('#pop')) closePop(); return; }
  if(!el.closest('#pop') && el.dataset.act!=='pop') closePop();
  const fn=ACT[el.dataset.act]; if(fn){ fn(el.dataset.v,el,e); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.query=e.target.value;renderConvList();}
  if(e.target.id==='dq'&&!e.isComposing){S.dirQuery=e.target.value;const pos=e.target.selectionStart;render();const n=$('#dq');n.focus();n.setSelectionRange(pos,pos);}
  if(e.target.id==='composer'){autosize();updateSend();}
  if(e.target.id==='palin'){palSel=0;renderPalRes(e.target.value);}
});
document.addEventListener('compositionend',e=>{if(e.target.id==='dq')e.target.dispatchEvent(new Event('input',{bubbles:true}));});
document.addEventListener('change',e=>{
  if(e.target.id==='pjcam'){S.prejoin.camDev=e.target.value;if(e.target.value==='facetime')S.prejoin.cam=true;renderOverlay();}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.screen==='app'){e.preventDefault();openPalette();return;}
  if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();return;}
  if(e.target.id==='mchatin'&&e.key==='Enter'&&!e.isComposing){const v=e.target.value.trim();if(!v)return;S.call.chat.push({from:'me',t:nowT(),text:v});render();setTimeout(()=>$('#mchatin')?.focus(),0);return;}
  if(e.target.id==='palin'){
    const items=paletteItems(e.target.value);
    if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(items.length-1,palSel+1);renderPalRes(e.target.value);}
    if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(0,palSel-1);renderPalRes(e.target.value);}
    if(e.key==='Enter'&&items[palSel]){e.preventDefault();palGo(items[palSel].type+':'+items[palSel].id);}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="switch"][data-act],[role="checkbox"][data-act]')&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.click();}
  if(e.key==='Escape'){
    if($('#palette').innerHTML){$('#palette').innerHTML='';return;}
    if($('#pop').innerHTML){closePop();return;}
    if(S.picker){S.picker=null;renderOverlay();return;}
    if(S.prejoin){ACT['prejoin-cancel']();return;}
  }
});
window.addEventListener('resize',closePop);

/* 计时器、说话人轮换、音量条 */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(()=>{
  if(!S.call) return;
  const t=fmtDur(Date.now()-S.call.start);
  const a=$('#ctimer'); if(a) a.textContent=t;
  const b=$('#mtimer'); if(b) b.textContent=t+(S.call.sharing?' · 你正在共享':'');
},1000);
setInterval(()=>{
  if(!S.call||S.call.min||reduce) return;
  const ps=participants().filter(p=>p.mic); if(!ps.length) return;
  const next=ps[Math.floor(Math.random()*ps.length)].k; S.call.speaker=next;
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('speaking',t.dataset.k===next));
},3200);
setInterval(()=>{
  const lv = el => { if(!el) return; const on=Math.floor(Math.random()*el.children.length*.7); [...el.children].forEach((i,n)=>i.classList.toggle('on',n<on)); };
  if(S.prejoin&&S.prejoin.mic) lv($('#pjmeter')); else { const m=$('#pjmeter'); if(m) [...m.children].forEach(i=>i.classList.remove('on')); }
  lv($('#setmeter'));
},reduce?1000:140);

render();
</script>
