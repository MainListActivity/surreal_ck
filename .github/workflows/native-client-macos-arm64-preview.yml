name: macOS Apple Silicon test package

on:
  push:
    branches: [codex/macos-arm64-ci]
  pull_request:
    paths:
      - 'native-client/**'
      - 'native-transport/**'
      - 'native-updater/**'
      - 'native-identity/**'
      - 'native-updater-platform/**'
      - 'native-media-platform/**'
      - 'native-call/**'
      - 'native-video-view/**'
      - 'native-signaling/**'
      - 'scripts/native-client/**'
      - '.github/workflows/native-client-macos-arm64-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-silicon-preview:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-client
          key: macos-arm64-collaboration-preview
      - name: Test preview contracts
        run: |
          python scripts/native-client/test_desktop_enterprise_preview.py
          python scripts/native-client/test_macos_arm_preview.py
      - name: Build and verify Apple Silicon test DMG
        run: bash scripts/native-client/package-macos-arm-preview.sh
      - name: Launch isolated packaged executable
        continue-on-error: true
        run: python scripts/native-client/smoke-macos-preview.py dist/macos-arm64-preview
      - uses: actions/upload-artifact@v4
        with:
          name: SurrealCK-macos-apple-silicon-test-only
          path: |
            dist/macos-arm64-preview/SurrealCK-macos-apple-silicon-test-only.dmg
            dist/macos-arm64-preview/SHA256SUMS.txt
            dist/macos-arm64-preview/preview-receipt.json
            dist/macos-arm64-preview/architecture.txt
            dist/macos-arm64-preview/dynamic-libraries.txt
            dist/macos-arm64-preview/launch-smoke.json
            dist/macos-arm64-preview/launch.log
            dist/macos-arm64-preview/TEST-ONLY.txt
          if-no-files-found: error
          retention-days: 30
