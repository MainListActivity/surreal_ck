name: Deploy origin

run-name: "Deploy origin ${{ inputs.sha }} (approval ${{ inputs.approval_ref }})"

# 只能被调用：Deploy production（自动，approval_ref 为本次运行号）与 Deploy origin (manual)
# （手动，approval_ref 为运营批准号）。顶层不提供 workflow_dispatch，手动入口统一经
# deploy-origin-manual.yml，见 docs/runbooks/production-release.md。
#
# 步骤顺序即安全边界：先校验 Quality gate，再上传（只写暂存件，不停服），最后由
# origin-release-ci.sh 登记激活并观察主机状态文件。SSH 断开不是成功，也不是回滚。
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      approval_ref:
        type: string
        required: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  origin:
    name: Hono origin (systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: production-origin
      cancel-in-progress: false
    environment:
      name: production
      url: https://l.maplayer.top/health
    permissions:
      checks: read
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
      ORIGIN_HOST: ${{ vars.ORIGIN_HOST }}
      ORIGIN_USER: ${{ vars.ORIGIN_USER }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Verify the release commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq 'any(.check_runs[]; .name == "Quality gate" and .conclusion == "success")')"
          if [ "$passed" != "true" ]; then
            echo "::error::Quality gate for $RELEASE_SHA has not succeeded"
            exit 1
          fi

      - name: Checkout deploy tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/deploy
          persist-credentials: false

      - name: Checkout the CI-approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORIGIN_SSH_KEY || secrets.SSH_KEY }}
          ORIGIN_KNOWN_HOSTS: ${{ vars.ORIGIN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_KEY ORIGIN_KNOWN_HOSTS ORIGIN_HOST ORIGIN_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/origin
          chmod 600 ~/.ssh/origin
          if ! fingerprint="$(ssh-keygen -y -P '' -f ~/.ssh/origin 2>/dev/null | ssh-keygen -lf - 2>/dev/null)"; then
            echo "::error::SSH_KEY is not an unencrypted OpenSSH/PEM private key"
            exit 1
          fi
          echo "deploy key: $fingerprint"
          printf '%s\n' "$ORIGIN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host origin
            HostName $ORIGIN_HOST
            User $ORIGIN_USER
            IdentityFile ~/.ssh/origin
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            ServerAliveInterval 15
          CFG

      - name: Derive release identifiers
        run: |
          set -euo pipefail
          echo "RELEASE_ID=${RELEASE_SHA:0:7}-ci${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Build release bundle and env additions
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          umask 077
          # ORIGIN_ENV_<NAME> secrets become <NAME>=<value> in the origin server.env.
          jq -r 'to_entries[] | select(.key | startswith("ORIGIN_ENV_")) | "\(.key | ltrimstr("ORIGIN_ENV_"))=\(.value)"' \
            <<<"$ALL_SECRETS" > env.additions
          if ! jq -e '[to_entries[] | select(.key | startswith("ORIGIN_ENV_")) | .value | select(contains("\n"))] | length == 0' \
            <<<"$ALL_SECRETS" >/dev/null; then
            echo "::error::ORIGIN_ENV_* secrets must be single-line values"
            exit 1
          fi
          echo "env keys: $(cut -d= -f1 env.additions | tr '\n' ' ')"
          # Non-secret, release-local metadata rolls back with the artifact, never server.env.
          mkdir -p runtime-metadata/server
          jq -n --arg sha "$RELEASE_SHA" --arg deploymentId "$DEPLOYMENT_ID" \
            '{sha: $sha, deploymentId: $deploymentId}' > runtime-metadata/server/runtime-release.json
          git -C release archive --format=tar -o "$PWD/release.tar" "$RELEASE_SHA"
          tar -rf release.tar -C runtime-metadata server/runtime-release.json
          gzip release.tar

      - name: Upload release bundle (staging only, no origin service change)
        run: |
          set -euo pipefail
          # 上传只写暂存件与工具副本：此时 origin 服务仍运行旧版本。任何上传失败都在停服之前结束。
          # 失败时尽力删除已上传的暂存件：env 增改含密钥，不能留在主机 /tmp 中。
          cleanup_staged() {
            local rc=$?
            rm -f env.additions
            if [ "$rc" -ne 0 ]; then
              ssh -o BatchMode=yes -o ConnectTimeout=20 origin \
                "rm -f /tmp/surreal_ck-env-${RELEASE_ID} /tmp/surreal_ck-${RELEASE_ID}.tar.gz /tmp/origin-release-${RELEASE_ID}.sh" \
                >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_staged EXIT
          scp -q env.additions "origin:/tmp/surreal_ck-env-${RELEASE_ID}"
          rm -f env.additions
          scp -q release.tar.gz "origin:/tmp/surreal_ck-${RELEASE_ID}.tar.gz"
          scp -q scripts/deploy/origin-release.sh "origin:/tmp/origin-release-${RELEASE_ID}.sh"

      - name: Activate release on origin (detached worker, bounded watch)
        run: |
          set -euo pipefail
          # 激活在 origin 分离的工作进程中完成；本步骤只登记并按主机状态文件收敛结果。
          bash scripts/deploy/origin-release-ci.sh \
            "$RELEASE_ID" \
            "/tmp/surreal_ck-${RELEASE_ID}.tar.gz" \
            "/tmp/surreal_ck-env-${RELEASE_ID}" \
            "$RELEASE_SHA" \
            "$APPROVAL_REF" \
            "$DEPLOYMENT_ID"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/origin
