name: Deploy origin

run-name: "Deploy origin ${{ inputs.sha }}"

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: 已通过 Quality gate 的提交（完整 SHA）
        type: string
        required: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  origin:
    name: Hono origin (systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: production-origin
      cancel-in-progress: false
    environment:
      name: production
      url: https://l.maplayer.top/health
    permissions:
      checks: read
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      ORIGIN_HOST: ${{ vars.ORIGIN_HOST }}
      ORIGIN_USER: ${{ vars.ORIGIN_USER }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Verify the release commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq 'any(.check_runs[]; .name == "Quality gate" and .conclusion == "success")')"
          if [ "$passed" != "true" ]; then
            echo "::error::Quality gate for $RELEASE_SHA has not succeeded"
            exit 1
          fi

      - name: Checkout deploy tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts/deploy
          persist-credentials: false

      - name: Checkout the CI-approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORIGIN_SSH_KEY || secrets.SSH_KEY }}
          ORIGIN_KNOWN_HOSTS: ${{ vars.ORIGIN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SSH_KEY ORIGIN_KNOWN_HOSTS ORIGIN_HOST ORIGIN_USER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/origin
          chmod 600 ~/.ssh/origin
          if ! fingerprint="$(ssh-keygen -y -P '' -f ~/.ssh/origin 2>/dev/null | ssh-keygen -lf - 2>/dev/null)"; then
            echo "::error::SSH_KEY is not an unencrypted OpenSSH/PEM private key"
            exit 1
          fi
          echo "deploy key: $fingerprint"
          printf '%s\n' "$ORIGIN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host origin
            HostName $ORIGIN_HOST
            User $ORIGIN_USER
            IdentityFile ~/.ssh/origin
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            PubkeyAcceptedAlgorithms +ssh-rsa
            ServerAliveInterval 15
            ConnectTimeout 10
          CFG

      - name: Upload and activate release
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          release_id="${RELEASE_SHA:0:7}-ci${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          archive="/tmp/surreal_ck-${release_id}.tar.gz"
          env_additions="/tmp/surreal_ck-env-${release_id}"
          release_script="/tmp/origin-release-${release_id}.sh"
          runner="/tmp/origin-release-runner-${release_id}.sh"
          umask 077
          # ORIGIN_ENV_<NAME> secrets become <NAME>=<value> in the origin server.env.
          jq -r 'to_entries[] | select(.key | startswith("ORIGIN_ENV_")) | "\(.key | ltrimstr("ORIGIN_ENV_"))=\(.value)"' \
            <<<"$ALL_SECRETS" > env.additions
          if ! jq -e '[to_entries[] | select(.key | startswith("ORIGIN_ENV_")) | .value | select(contains("\n"))] | length == 0' \
            <<<"$ALL_SECRETS" >/dev/null; then
            echo "::error::ORIGIN_ENV_* secrets must be single-line values"
            exit 1
          fi
          echo "env keys: $(cut -d= -f1 env.additions | tr '\n' ' ')"
          scp -q env.additions "origin:$env_additions"
          rm -f env.additions
          # Non-secret, release-local metadata rolls back with the artifact, never server.env.
          mkdir -p runtime-metadata/server
          jq -n --arg sha "$RELEASE_SHA" --arg deploymentId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{sha: $sha, deploymentId: $deploymentId}' > runtime-metadata/server/runtime-release.json
          git -C release archive --format=tar -o "$PWD/release.tar" "$RELEASE_SHA"
          tar -rf release.tar -C runtime-metadata server/runtime-release.json
          gzip release.tar
          scp -q release.tar.gz "origin:$archive"
          scp -q scripts/deploy/origin-release.sh "origin:$release_script"
          scp -q scripts/deploy/origin-release-runner.sh "origin:$runner"
          # 远端发布经 runner 以分离会话执行：本 job 的 SSH 会话死亡不会让
          # 远端中止在「已切 current、已写 env、服务未健康」的半部署态——
          # healthy 与 rollback 都在主机上无人值守收尾，终态写进
          # deploy-jobs/<release_id>/result（原子）供重连轮询。
          # 重发 launch 是安全的：远端以 release_id 原子认领 job，重复调用
          # attach 到同一次发布而不重入。
          launched=
          for attempt in 1 2 3 4 5; do
            if ssh origin "bash '$runner' launch '$release_id' '$release_script' '$archive' '$env_additions'"; then
              launched=1
              break
            fi
            [ "$attempt" = 5 ] || sleep 5
          done
          if [ -z "$launched" ]; then
            echo '::error::Could not start or reconnect to the origin release'
            exit 1
          fi
          # 轮询只读终态文件；中途 SSH 失败不代表远端失败，重连继续读同一状态。
          for poll in $(seq 1 90); do
            if result="$(ssh origin "bash '$runner' status '$release_id'")"; then
              case "$result" in
                success)
                  ssh origin "bash '$runner' log '$release_id'" || true
                  echo "origin release $release_id healthy"
                  exit 0
                  ;;
                failed:*)
                  ssh origin "bash '$runner' log '$release_id'" || true
                  echo "::error::origin release $release_id: $result"
                  exit 1
                  ;;
                running) ;;
                *)
                  echo "::error::unexpected origin release status: $result"
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "::error::origin release $release_id did not finish within 15 minutes; remote job may still be running"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/origin
