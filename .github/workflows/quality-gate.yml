name: Quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install exact pnpm and frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          test "$(pnpm --version)" = "10.32.1"
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Install company SurrealDB fork for integration tests
        run: |
          set -euo pipefail
          # 公司 fork 的已发布候选制品（MainListActivity/surrealdb）：固定到具体候选 tag，并校验 sha256。
          # 候选清单 image.digest 与生产晋升回执一致（release 3.3.0-native-quota.1）。不使用上游官方发行版或 latest。
          candidate="sck-3.3.0-native-quota.1-candidate.105"
          archive="$RUNNER_TEMP/surreal-native-quota.linux-amd64.tgz"
          curl --fail --location --silent --show-error \
            "https://github.com/MainListActivity/surrealdb/releases/download/${candidate}/surreal-native-quota.linux-amd64.tgz" \
            --output "$archive"
          echo "06af02af91e90a245f1f30a145629d965ed8837912118915c11b1d46812ec49e  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/surreal-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/surreal-cli"
          binary="$(find "$RUNNER_TEMP/surreal-cli" -type f -name surreal -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" version
          echo "SURREAL_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test

      - name: Build web application
        run: pnpm --filter @surreal-ck/web build

      - name: Build marketing site
        run: pnpm build:marketing

      - name: Build ops console
        run: pnpm build:ops

      - name: Build deployable server image
        run: docker build --tag surreal-ck:quality .
