name: Deploy origin (manual)

run-name: "Deploy origin ${{ inputs.sha }} (manual, approval ${{ inputs.approval_ref }})"

# 手动重发/回滚 origin 的唯一入口。顶层只做输入登记与 main 守卫，真正的发布逻辑在
# deploy-origin.yml（workflow_call，与 Deploy production 调用的是同一份代码）。
# dry_run=true 时只运行 probe 作业：它不使用 environment 也不使用 secrets，用于验证派发能否产生作业。
# 运行 39153839203 等自 2026-09-29 起的直接派发被记为 action_required 且没有作业，根因未经 API 证实，见 runbook。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 已通过 Quality gate 的提交（完整 SHA；须是 origin/main 的祖先；回滚时填上一个已通过 Quality gate 的提交）
        type: string
        required: true
      approval_ref:
        description: 运营批准或回滚记录编号（写入运行名称与作业日志，用于审计）
        type: string
        required: true
      dry_run:
        description: 探针模式：只运行不接触 environment 与 secrets 的 probe 作业，不发布（用于验证派发能否产生作业）
        type: boolean
        default: false
      hold_seconds:
        description: 探针模式下持有 production-release 发布锁的秒数（0 至 900，仅 dry_run 生效；用于验证与其它入口的排队互斥）
        type: string
        default: "0"

# 与 release-frontend-recovery.yml、deploy-production.yml 共用顶层发布锁组，origin 发布与前端发布互斥。
concurrency:
  group: production-release
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    name: Dispatch probe (no environment, no secrets)
    if: github.ref == 'refs/heads/main' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      PROBE_SHA: ${{ inputs.sha }}
      HOLD_SECONDS: ${{ inputs.hold_seconds }}
    steps:
      - name: Record the probe and hold the release lock
        run: |
          set -euo pipefail
          [[ "$HOLD_SECONDS" =~ ^[0-9]{1,3}$ ]] && [ "$HOLD_SECONDS" -le 900 ] \
            || { echo "::error::hold_seconds must be an integer from 0 to 900"; exit 1; }
          echo "dispatch probe reached a job; requested sha=$PROBE_SHA; holding production-release for ${HOLD_SECONDS}s; no environment and no secrets were used"
          sleep "$HOLD_SECONDS"

  origin:
    name: Hono origin (manual)
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/deploy-origin.yml
    with:
      sha: ${{ inputs.sha }}
      approval_ref: ${{ inputs.approval_ref }}
    secrets: inherit
