name: Frontend recovery

run-name: "Frontend recovery ${{ inputs.sha }} (evidence PR #${{ inputs.evidence_pr }}, approval ${{ inputs.approval_ref }})"

# 前端定向恢复：只把 web / marketing / ops / edge 发布到 Cloudflare。
# 本文件不调用 deploy-origin.yml，不含 SSH/SCP，不停服、不切换 current、不改 server.env；origin 不由本工作流改动。
# 只能从默认分支手动触发。发布作业先完成构建（无生产写入），再在本次运行内生成 barrier 并写入作业摘要。
# 运营在 barrier 之后只读核定 origin 运行 SHA，并在证据 PR 上发表绑定该 barrier 的评论（见 runbook）。
# barrier 同时以 artifact origin-barrier-<run id>-<attempt> 上传，运行中由运营经 origin-verification.py fetch 取回并校验（见 runbook）。
# 发布作业有界等待该评论（最多 20 分钟），并在第一次生产写入之前再次校验评论与 origin 健康；任一失败即结束，发布锁随之释放。
# 顶层发布锁组 production-release 与 Deploy production、Deploy origin (manual) 共用：任一入口运行时其余入口排队。
# 局部重跑（run attempt 大于 1）被拒绝：须整条重新派发，每次运行都需要新的 barrier 与新的核定评论。
# dry_run=true 时只运行 probe 作业（不使用 environment 与 secrets），用于验证派发与锁互斥；不生成 barrier，不等待批准，不发布。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 目标提交（完整 SHA；须已合入 main 且 Quality gate 成功；须等于运营在锁内核定的 origin 运行 SHA）
        type: string
        required: true
      evidence_pr:
        description: 承载运营核定证据评论的 PR 编号（评论作者须在仓库变量 RELEASE_APPROVER_LOGINS 中）
        type: string
        required: true
      approval_ref:
        description: fa 运营 accept 审计编号（须与证据评论中的 fa_audit_ref 逐字相同）
        type: string
        required: true
      dry_run:
        description: 探针模式：只运行不接触 environment 与 secrets 的 probe 作业，不生成 barrier、不发布（合入后须先跑一次）
        type: boolean
        default: false
      hold_seconds:
        description: 探针模式下持有 production-release 发布锁的秒数（0 至 900，仅 dry_run 生效；用于验证与其它入口的排队互斥）
        type: string
        default: "0"

concurrency:
  group: production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  probe:
    name: Dispatch probe (no environment, no secrets)
    if: github.ref == 'refs/heads/main' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    env:
      HOLD_SECONDS: ${{ inputs.hold_seconds }}
    steps:
      - name: Record the probe and hold the release lock
        run: |
          set -euo pipefail
          [[ "$HOLD_SECONDS" =~ ^[0-9]{1,3}$ ]] && [ "$HOLD_SECONDS" -le 900 ] \
            || { echo "::error::hold_seconds must be an integer from 0 to 900"; exit 1; }
          echo "dispatch probe reached a job; holding production-release for ${HOLD_SECONDS}s; no environment and no secrets were used"
          sleep "$HOLD_SECONDS"

  validate:
    name: Validate frontend recovery target
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      EVIDENCE_PR: ${{ inputs.evidence_pr }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
      RELEASE_APPROVER_LOGINS: ${{ vars.RELEASE_APPROVER_LOGINS }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout deploy tooling and main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run frontend recovery gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy/frontend-recovery-gate.sh

      - name: Record recovery target
        run: |
          set -euo pipefail
          {
            echo "### Frontend recovery target (read-only gate passed)"
            echo "- release sha: $RELEASE_SHA"
            echo "- evidence PR: #$EVIDENCE_PR"
            echo "- approval: $APPROVAL_REF"
            echo "- origin is verified under the lock in the deploy job; this job does not change origin"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Cloudflare frontend (origin verified under the lock)
    needs: validate
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://l.maplayer.top
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      EVIDENCE_PR: ${{ inputs.evidence_pr }}
      APPROVAL_REF: ${{ inputs.approval_ref }}
      RELEASE_APPROVER_LOGINS: ${{ vars.RELEASE_APPROVER_LOGINS }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Refuse reruns (each run needs a new barrier and a new evidence comment)
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::rerun refused (attempt $GITHUB_RUN_ATTEMPT): dispatch a new Frontend recovery run; it needs a new barrier and a new operator evidence comment"
            exit 1
          fi

      - name: Verify the release commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq 'any(.check_runs[]; .name == "Quality gate" and .conclusion == "success")')"
          if [ "$passed" != "true" ]; then
            echo "::error::Quality gate for $RELEASE_SHA has not succeeded"
            exit 1
          fi

      - name: Validate production configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_PAGES_PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
          MARKETING_PAGES_PROJECT: ${{ vars.MARKETING_PAGES_PROJECT }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SURREAL_URL: ${{ vars.VITE_SURREAL_URL }}
          VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_AUDIENCE: ${{ vars.VITE_OIDC_AUDIENCE }}
          VITE_OPS_OIDC_ISSUER: ${{ vars.VITE_OPS_OIDC_ISSUER }}
          VITE_OPS_OIDC_CLIENT_ID: ${{ vars.VITE_OPS_OIDC_CLIENT_ID }}
          VITE_OPS_OIDC_AUDIENCE: ${{ vars.VITE_OPS_OIDC_AUDIENCE }}
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WEB_PAGES_PROJECT
            MARKETING_PAGES_PROJECT
            VITE_API_BASE_URL
            VITE_SURREAL_URL
            VITE_OIDC_ISSUER
            VITE_OIDC_CLIENT_ID
            VITE_OIDC_REDIRECT_URI
            VITE_OIDC_AUDIENCE
            VITE_OPS_OIDC_ISSUER
            VITE_OPS_OIDC_CLIENT_ID
            VITE_OPS_OIDC_AUDIENCE
            VITE_OPS_API_BASE_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done

      # 与 deploy-production.yml 相同的根布局：营销站构建会解析工作区根的 shared 包，放在 release/ 子目录会失败。
      # 本检出是 deploy 作业唯一的根目录检出，且必须先于 tooling 检出：根目录没有 .git 时，actions/checkout 会先清空整个目录，
      # clean: false 不阻止这一点。审计工具在构建之后才检出到 tooling/。
      - name: Checkout the CI-approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          clean: false
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install exact pnpm and frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          test "$(pnpm --version)" = "10.32.1"
          pnpm install --frozen-lockfile

      - name: Build production sites
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SURREAL_URL: ${{ vars.VITE_SURREAL_URL }}
          VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_OIDC_AUDIENCE: ${{ vars.VITE_OIDC_AUDIENCE }}
          VITE_OPS_OIDC_ISSUER: ${{ vars.VITE_OPS_OIDC_ISSUER }}
          VITE_OPS_OIDC_CLIENT_ID: ${{ vars.VITE_OPS_OIDC_CLIENT_ID }}
          VITE_OPS_OIDC_AUDIENCE: ${{ vars.VITE_OPS_OIDC_AUDIENCE }}
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
          SCK_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          SCK_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pnpm --filter @surreal-ck/web build
          pnpm build:marketing
          # ops 控制台同域子路径发布：与 Deploy production 相同的产物布局。
          VITE_OPS_BASE=/ops/ pnpm build:ops
          mkdir -p web/dist
          rm -rf web/dist/ops
          cp -r ops/dist web/dist/ops

      # 审计工具在构建之后检出：构建树与发布提交保持一致，不含嵌套的 tooling 仓库。之后只有 barrier、wait、verify 使用它。
      - name: Checkout deploy tooling (audited main, sparse)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/deploy
          path: tooling
          persist-credentials: false

      - name: Generate the in-lock origin barrier
        run: |
          set -euo pipefail
          # barrier 在构建之后、任何生产写入之前生成；它绑定本次运行、受审 tooling、目标与随机 nonce。
          test -f tooling/scripts/deploy/origin-verification.py \
            || { echo "::error::tooling/scripts/deploy/origin-verification.py is missing from the audited tooling checkout"; exit 1; }
          python3 tooling/scripts/deploy/origin-verification.py barrier \
            --target "$RELEASE_SHA" \
            --out "$RUNNER_TEMP/origin-barrier.json"
          # 注解只在作业结束后可读（运行中经 check-run annotations API 读取为空，已实测），因此它只作事后审计；运行中的取回通道是下一步的 artifact。
          # 单行，消息只含 barrier 本身（不含凭证）。先赋值再输出：jq 失败时 set -e 使本步骤失败，不会发出空消息。
          barrier_compact="$(jq -c . "$RUNNER_TEMP/origin-barrier.json")"
          printf '::notice title=origin-verification-barrier::%s\n' "$barrier_compact"
          {
            echo "### Origin verification barrier (generated under production-release, before any production write)"
            echo ""
            echo "Only an evidence comment on PR #$EVIDENCE_PR that binds this barrier is accepted."
            echo "While the run is in progress, the same barrier is readable as artifact origin-barrier-<run id>-<run attempt>; fetch it with origin-verification.py fetch and sample origin only after that. Post with the post subcommand from the checkout of tooling_sha."
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/origin-barrier.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 运行中可读的机器通道：同一份 barrier 以 artifact 上传；名称含 run id 与 attempt，overwrite 为 false（同名即失败），保留 1 天。
      # 运营在 Wait 期间经 origin-verification.py fetch 按名称取回并逐项校验；CI 的 wait 与 verify 仍以本作业生成的文件为准，不读取此 artifact。
      # 本步骤不需要 GH_TOKEN 或 secrets；上传失败则作业失败，Wait 与任何生产写入都不会开始。
      - name: Publish the origin barrier as a run artifact (readable while the run is in progress)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: origin-barrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/origin-barrier.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

      - name: Wait for operator origin evidence (bounded, 20 minutes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 超时、无证据、证据不合格或读取错误都使本作业失败，发布锁随之释放。
          python3 tooling/scripts/deploy/origin-verification.py wait \
            --barrier "$RUNNER_TEMP/origin-barrier.json" \
            --target "$RELEASE_SHA" \
            --pr "$EVIDENCE_PR" \
            --approvers "$RELEASE_APPROVER_LOGINS" \
            --approval-ref "$APPROVAL_REF" \
            --timeout 1200 \
            --interval 30 \
            --result "$RUNNER_TEMP/origin-evidence.json"

      - name: Re-verify origin evidence and origin health before the first production write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tooling/scripts/deploy/origin-verification.py verify \
            --barrier "$RUNNER_TEMP/origin-barrier.json" \
            --target "$RELEASE_SHA" \
            --pr "$EVIDENCE_PR" \
            --approvers "$RELEASE_APPROVER_LOGINS" \
            --approval-ref "$APPROVAL_REF" \
            --result "$RUNNER_TEMP/origin-evidence.json"
          curl --fail --silent --show-error --max-time 15 https://l.maplayer.top/health \
            | jq -e '.status == "ok" and .surrealdb == "up"' >/dev/null \
            || { echo "::error::origin health is not ok immediately before the production writes; stopping"; exit 1; }
          echo "origin evidence and origin health hold immediately before the first production write"

      - name: Deploy Hono edge proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.135.0 deploy

      - name: Deploy application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEB_PAGES_PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.135.0 pages deploy web/dist \
            --project-name "$WEB_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Deploy marketing site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARKETING_PAGES_PROJECT: ${{ vars.MARKETING_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.135.0 pages deploy marketing/dist/client \
            --project-name "$MARKETING_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify production
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/ >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/health \
            | jq -e '.status == "ok" and .surrealdb == "up"' >/dev/null
          # 前端身份：公开的 runtime-version.json 必须显示本次目标 SHA 与本次运行的 deploymentId。
          # 这证明当前 Pages 部署即目标构建；不证明某浏览器仍缓存的旧 JS 已刷新。
          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://l.maplayer.top/runtime-version.json?t=$(date +%s)" \
              | jq -e --arg sha "$RELEASE_SHA" --arg dep "$EXPECTED_DEPLOYMENT_ID" \
                '.sha == $sha and .deploymentId == $dep' >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::https://l.maplayer.top/runtime-version.json does not show $RELEASE_SHA ($EXPECTED_DEPLOYMENT_ID)"
            exit 1
          fi
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://www.maplayer.top/ >/dev/null
          # /ops/ 必须是 ops 控制台页面；未发布时 SPA fallback 会返回客户应用壳，用标题区分。
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/ops/ \
            | grep -q '运营控制台'
