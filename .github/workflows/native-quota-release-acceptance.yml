name: Native quota promotion secret presence check

on:
  workflow_dispatch:

permissions: {}

jobs:
  presence:
    name: Check whether the promotion secret is available
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/devin/1795454537-promotion-secret-presence'
    runs-on: ubuntu-24.04
    environment:
      name: native-quota-production-acceptance
      deployment: false
    steps:
      - name: Report presence only
        env:
          TOKEN_PRESENT: ${{ secrets.NATIVE_QUOTA_PROMOTION_TOKEN != '' }}
        run: |
          set -euo pipefail
          case "$TOKEN_PRESENT" in
            true) echo 'Promotion token is configured.' ;;
            false) echo '::error::Promotion token is not configured.'; exit 1 ;;
            *) echo '::error::Could not evaluate token presence.'; exit 2 ;;
          esac
