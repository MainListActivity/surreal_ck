name: Deploy production

run-name: "Deploy ${{ github.event.workflow_run.head_sha || github.sha }} to production"

on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  precheck:
    name: Validate production configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    permissions: {}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEB_PAGES_PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
      MARKETING_PAGES_PROJECT: ${{ vars.MARKETING_PAGES_PROJECT }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SURREAL_URL: ${{ vars.VITE_SURREAL_URL }}
      VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
      VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
      VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
      VITE_OIDC_AUDIENCE: ${{ vars.VITE_OIDC_AUDIENCE }}
      VITE_OPS_OIDC_ISSUER: ${{ vars.VITE_OPS_OIDC_ISSUER }}
      VITE_OPS_OIDC_CLIENT_ID: ${{ vars.VITE_OPS_OIDC_CLIENT_ID }}
      VITE_OPS_OIDC_AUDIENCE: ${{ vars.VITE_OPS_OIDC_AUDIENCE }}
      VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
    steps:
      - name: Validate required configuration
        run: |
          set -euo pipefail
          # 在 origin 更新前做全量配置预检，避免「origin 已换版、静态发布缺参」的
          # 分裂发布。deploy job 内保留同名校验作为兜底。
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WEB_PAGES_PROJECT
            MARKETING_PAGES_PROJECT
            VITE_API_BASE_URL
            VITE_SURREAL_URL
            VITE_OIDC_ISSUER
            VITE_OIDC_CLIENT_ID
            VITE_OIDC_REDIRECT_URI
            VITE_OIDC_AUDIENCE
            VITE_OPS_OIDC_ISSUER
            VITE_OPS_OIDC_CLIENT_ID
            VITE_OPS_OIDC_AUDIENCE
            VITE_OPS_API_BASE_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done

  origin:
    name: Hono origin
    needs: precheck
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/deploy-origin.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  deploy:
    name: Cloudflare production
    needs: origin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://l.maplayer.top
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SURREAL_URL: ${{ vars.VITE_SURREAL_URL }}
      VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
      VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
      VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
      VITE_OIDC_AUDIENCE: ${{ vars.VITE_OIDC_AUDIENCE }}
      VITE_OPS_OIDC_ISSUER: ${{ vars.VITE_OPS_OIDC_ISSUER }}
      VITE_OPS_OIDC_CLIENT_ID: ${{ vars.VITE_OPS_OIDC_CLIENT_ID }}
      VITE_OPS_OIDC_AUDIENCE: ${{ vars.VITE_OPS_OIDC_AUDIENCE }}
      VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Verify the release commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq 'any(.check_runs[]; .name == "Quality gate" and .conclusion == "success")')"
          if [ "$passed" != "true" ]; then
            echo "::error::Quality gate for $RELEASE_SHA has not succeeded"
            exit 1
          fi

      - name: Validate production configuration
        env:
          WEB_PAGES_PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
          MARKETING_PAGES_PROJECT: ${{ vars.MARKETING_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            WEB_PAGES_PROJECT
            MARKETING_PAGES_PROJECT
            VITE_API_BASE_URL
            VITE_SURREAL_URL
            VITE_OIDC_ISSUER
            VITE_OIDC_CLIENT_ID
            VITE_OIDC_REDIRECT_URI
            VITE_OIDC_AUDIENCE
            VITE_OPS_OIDC_ISSUER
            VITE_OPS_OIDC_CLIENT_ID
            VITE_OPS_OIDC_AUDIENCE
            VITE_OPS_API_BASE_URL
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done

      - name: Checkout the CI-approved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Install exact Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install exact pnpm and frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          test "$(pnpm --version)" = "10.32.1"
          pnpm install --frozen-lockfile

      - name: Build production sites
        env:
          SCK_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          SCK_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pnpm --filter @surreal-ck/web build
          pnpm build:marketing
          # ops 控制台同域子路径发布：产物挂到应用 Pages 项目的 /ops/ 目录，
          # 与运营 API 同源，不引入跨域面。
          VITE_OPS_BASE=/ops/ pnpm build:ops
          mkdir -p web/dist
          rm -rf web/dist/ops
          cp -r ops/dist web/dist/ops

      - name: Deploy Hono edge proxy
        run: pnpm dlx wrangler@4.135.0 deploy

      - name: Deploy application
        env:
          WEB_PAGES_PROJECT: ${{ vars.WEB_PAGES_PROJECT }}
        run: |
          pnpm dlx wrangler@4.135.0 pages deploy web/dist \
            --project-name "$WEB_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Deploy marketing site
        env:
          MARKETING_PAGES_PROJECT: ${{ vars.MARKETING_PAGES_PROJECT }}
        run: |
          pnpm dlx wrangler@4.135.0 pages deploy marketing/dist/client \
            --project-name "$MARKETING_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$RELEASE_SHA" \
            --commit-dirty=false

      - name: Verify production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/ >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/health \
            | jq -e '.status == "ok" and .surrealdb == "up"' >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://www.maplayer.top/ >/dev/null
          # /ops/ 必须是 ops 控制台页面；未发布时 SPA fallback 会返回客户应用壳，
          # 用标题区分两者。
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 5 https://l.maplayer.top/ops/ \
            | grep -q '运营控制台'
