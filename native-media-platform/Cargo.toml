[package]
name = "surreal-ck-native-media-platform"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
bytes = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time"] }
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6.2"

[dev-dependencies]
jni = "0.21.1"
