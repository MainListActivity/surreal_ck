[package]
name = "surreal-ck-peer-transport"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
webrtc = "=0.14.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
bytes = "1"
sha2 = "0.10"
thiserror = "2"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# 仅候选桌面后端的真实Transfer单元测试使用；不把候选模块链接到生产library。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO"] }
