[package]
name = "surreal-ck-native-signaling"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
surreal-ck-native-identity = { path = "../native-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17.14"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
