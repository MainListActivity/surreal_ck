[package]
name = "surreal-video-platform-api-check"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "lib.rs"
[features]
macos-appkit = []
windows-d2d = []
[dependencies]
surreal-ck-native-video-view = { path = "../..", default-features = false }
serde_json = "1"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImageView", "NSImageCell", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSGraphics", "NSControl", "NSCell", "NSView", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSTimer", "NSRunLoop", "NSDate", "NSObjCRuntime", "NSObject", "NSGeometry", "NSString"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common"] }
