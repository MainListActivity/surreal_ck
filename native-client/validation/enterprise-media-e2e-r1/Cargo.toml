[package]
name = "surreal-ck-enterprise-media-e2e-r1"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[features]
default = []
experimental-enterprise-signaling = []
experimental-enterprise-files = ["experimental-enterprise-signaling"]
experimental-enterprise-media = []
android-auto-update = []

[dependencies]
bytes = "1"
async-channel = "2"
surreal-ck-native-call = { path = "/workspace/scratch/115bfa675150/native-client-probe/surreal_ck/native-call" }
surreal-ck-native-video-view = { path = "/workspace/scratch/115bfa675150/native-client-probe/surreal_ck/native-video-view", features = ["linux-gtk"] }
nsh-core = "0.4.0"
surreal-ck-peer-transport = { path = "/workspace/scratch/115bfa675150/native-client-probe/surreal_ck/native-transport" }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
jsonwebtoken = { version = "9.3", default-features = false }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "rt"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
