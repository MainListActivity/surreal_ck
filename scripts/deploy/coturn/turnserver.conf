listening-ip=10.0.0.112
relay-ip=10.0.0.112
external-ip=129.146.179.37/10.0.0.112
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49359

realm=data.maplayer.top
use-auth-secret
# 在主机上将 static-auth-secret 追加到仅 root 可读的完整配置。
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
no-tlsv1
no-tlsv1_1
no-dtls

fingerprint
no-cli
no-multicast-peers
no-tcp-relay
no-dynamic-ip-list
stale-nonce=600
user-quota=12
total-quota=100
max-bps=500000

# 默认拒绝；只在主机最终配置中添加经授权的公网 IPv4 allowed-peer-ip。
# coturn 中 allow 优先于 deny；禁止将下列地址加入 allowlist。
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=129.146.179.37
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# 现代 coturn 默认阻断 loopback；不要开启 allow-loopback-peers。

syslog
simple-log
