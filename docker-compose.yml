services:
  surrealdb:
    # 只接受 native-quota candidate/production receipt 中的自有仓库 digest。
    # tag、官方 surrealdb/surrealdb 镜像和空值都会在 compose 解析/应用启动门失败。
    image: "${SURREALDB_NATIVE_QUOTA_IMAGE:?set a digest-pinned ghcr.io/mainlistactivity/surrealdb-native-quota@sha256 reference}"
    command:
      - start
      - --user
      - "${SURREAL_ROOT_USER:?set SURREAL_ROOT_USER}"
      - --pass
      - "${SURREAL_ROOT_PASS:?set SURREAL_ROOT_PASS}"
      - rocksdb:/data
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-native-quota-data:/data
    healthcheck:
      test:
        - CMD
        - /surreal
        - is-ready
        - --endpoint
        - http://127.0.0.1:8000
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  server:
    build: .
    depends_on:
      surrealdb:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_ROOT_USER: "${SURREAL_ROOT_USER:?set SURREAL_ROOT_USER}"
      SURREAL_ROOT_PASS: "${SURREAL_ROOT_PASS:?set SURREAL_ROOT_PASS}"
    ports:
      - "8080:8080"

volumes:
  surrealdb-native-quota-data:
