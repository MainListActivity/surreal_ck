[package]
name = "surreal-ck-native-updater-platform"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
surreal-ck-native-updater = { path = "../native-updater" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[build-dependencies]
cc = "1.11.1"
[features]
default = []
macos-sparkle = []

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_SystemServices", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
sha2 = "0.10.9"
